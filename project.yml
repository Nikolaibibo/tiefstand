# XcodeGen spec — the source of truth for the Xcode project.
#
# Tiefstand stays a pure SwiftPM package (Package.swift); this file exists ONLY
# to produce an Xcode project for the one thing SwiftPM can't do: build + register
# a WidgetKit extension through Apple's sanctioned toolchain. The app and widget
# targets reuse the exact same source folders + the local package's library
# products (TiefstandCore, TiefstandUI) — no duplicated code.
#
# Regenerate with:  xcodegen generate   (the .xcodeproj is gitignored)
name: Tiefstand

options:
  bundleIdPrefix: com.nikolaibockholt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Set your signing team before generating:  export DEVELOPMENT_TEAM=XXXXXXXXXX
    # (find it via `security find-identity -v -p codesigning` or Xcode → Accounts).
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    # Sourced from Scripts/version.sh — do not edit here. Generate with
    # Scripts/xcodegen.sh, which exports them before calling xcodegen.
    MARKETING_VERSION: ${VERSION}
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  TiefstandKit:
    path: .

targets:
  # Named TiefstandApp, not Tiefstand, on purpose. The SwiftPM package exports
  # an executable product called Tiefstand, and with both in scope
  # `xcodebuild -target Tiefstand` silently resolves to the package product:
  # it reports BUILD SUCCEEDED and emits a bare binary with no .app bundle at
  # all. PRODUCT_NAME keeps the built app called Tiefstand.app.
  TiefstandApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tiefstand
    dependencies:
      - package: TiefstandKit
        product: TiefstandCore
      - package: TiefstandKit
        product: TiefstandUI
      - target: TiefstandWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaibockholt.Tiefstand
        PRODUCT_NAME: Tiefstand
    info:
      path: build-xcode/Info-App.plist
      properties:
        CFBundleName: Tiefstand
        CFBundleDisplayName: Tiefstand
        # Pulled from the build settings, which come from Scripts/version.sh.
        # Without these two keys XcodeGen writes its own default of 1.0/1 —
        # which is where the installed app's phantom "v1.0" came from while
        # the releases said 0.4.0.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Nikolai Bockholt. MIT-licensed. Water data © NIWIS/BfG and WSV/PEGELONLINE."
        NSLocationUsageDescription: "Tiefstand uses your location to find the nearest water gauge."
        # The key requestWhenInUseAuthorization actually reads on modern macOS.
        NSLocationWhenInUseUsageDescription: "Tiefstand uses your location to find the nearest water gauge."

  TiefstandWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/TiefstandWidget
    dependencies:
      - package: TiefstandKit
        product: TiefstandCore
      - package: TiefstandKit
        product: TiefstandUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaibockholt.Tiefstand.Widget
    entitlements:
      path: build-xcode/TiefstandWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: build-xcode/Info-Widget.plist
      properties:
        CFBundleName: TiefstandWidget
        CFBundleDisplayName: Tiefstand
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
